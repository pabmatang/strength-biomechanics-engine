name: CI / CD Pipeline - Quality Gate & Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, TypeCheck & Automated Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis (Linter)
        run: npm run lint || true

      - name: TypeScript Strict Type Check
        run: npx tsc -b --noEmit

      - name: Execute Automated Unit Tests (Vitest)
        run: npm test

      - name: Production Bundle Build (Vite)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7
