# docker-java defaults to Docker API 1.32, but Docker Engine 29+ rejects any API
# version below 1.40 (the server answers 400 and Testcontainers reports
# "Could not find a valid Docker environment").
#
# 1.41 is the lowest version understood by docker-java 3.4.x that every Docker
# Engine from 20.10 onwards still accepts, so it works locally and on CI.
api.version=1.41
