spring:
  application:
    name: strength-biomechanics-engine
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mia_fitness}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Flyway is the single source of truth for the schema (src/main/resources/db/migration).
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.2-vision}
          temperature: 0.2
      embedding:
        options:
          model: ${SPRING_AI_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    # Must match the model output and the vector(N) column in the migration.
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:768}
  knowledge-base:
    # Set to false in tests or when you do not want the app to touch Ollama at startup.
    seed: ${SEED_KNOWLEDGE_BASE:true}

security:
  jwt:
    # Development-only fallback. Set JWT_SECRET_KEY (>= 32 bytes) in any real deployment.
    secret-key: ${JWT_SECRET_KEY:dev-only-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-time-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
