[cerebrium.deployment]
name = "biomechanics-engine"
python_version = "3.11"
include = ["main.py", "cerebrium.toml"]
exclude = [".*", "__pycache__", "*.pyc", "motionbert_3d.py"]

[cerebrium.hardware]
cpu = 2.0
memory = 8.0
compute = "TURING_T4"
gpu_count = 1
provider = "aws"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 1
cooldown = 300
response_timeout = 120

[cerebrium.dependencies.pip]
torch = ">=2.2.0"
torchvision = ">=0.17.0"
transformers = ">=4.48.0"
opencv-python-headless = ">=4.9.0"
scipy = ">=1.12.0"
numpy = ">=1.26.0"
pillow = ">=10.2.0"
huggingface_hub = ">=0.25.0"
pydantic = ">=2.0.0"
requests = ">=2.31.0"
av = ">=12.0.0"
