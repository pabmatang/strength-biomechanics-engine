version: '3.8'

services:
  # PostgreSQL 16 with pgvector extension for relational data and semantic vector search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mia_fitness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mia_fitness"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mia_net

  # Local Ollama AI Server with Llama 3.2 Vision and Nomic Embed Text
  ollama:
    image: ollama/ollama:latest
    container_name: mia_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - mia_net

  # Java 21 / Spring Boot 3.3.4 Biomechanics Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mia_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mia_fitness
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_CHAT_MODEL: llama3.2-vision
      SPRING_AI_OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      JWT_SECRET_KEY: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    networks:
      - mia_net

  # React 19 + TypeScript + Vite + Nginx Frontend PWA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mia_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - mia_net

volumes:
  postgres_data:
  ollama_storage:

networks:
  mia_net:
    driver: bridge
